/**
 * Submodules import sample
 */
dependencies {
    implementation project(':task-tracker-api-miscellaneous:data')
    implementation project(':task-tracker-api-miscellaneous:store')
    implementation project(':task-tracker-api-shared')

    testImplementation project(':task-tracker-api-shared').sourceSets.test.output
}

/**
 * Spring
 */
dependencies {
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
}

/****
 * Querydsl
 */
dependencies {
    implementation 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.1.0'
}